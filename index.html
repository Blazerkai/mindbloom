<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindBloom — Level Up Your Life</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2'%3E%3Cpath d='M12 3c-2 3-2 6 0 9 2-3 2-6 0-9z'/%3E%3Cpath d='M12 12c-4 0-7 2-8 5 3 1 6 0 8-3 2 3 5 4 8 3-1-3-4-5-8-5z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Auth gate -->
    <div id="auth-gate" class="auth-gate">
      <div class="auth-card glass-card">
        <div class="brand">
          <span class="brand-logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-2 3-2 6 0 9 2-3 2-6 0-9z"/><path d="M12 12c-4 0-7 2-8 5 3 1 6 0 8-3 2 3 5 4 8 3-1-3-4-5-8-5z"/></svg></span>
          <h1>MindBloom</h1>
          <p>Level up your life</p>
        </div>
        <div id="auth-form-slot"></div>
      </div>
    </div>

    <!-- Main shell (shown once signed in) -->
    <div id="shell" class="shell hidden">
      <header class="topbar">
        <button id="btn-menu" class="icon-btn btn-menu" title="Menu" aria-label="Open menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
        <div class="topbar-brand">
          <span class="brand-logo small"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-2 3-2 6 0 9 2-3 2-6 0-9z"/><path d="M12 12c-4 0-7 2-8 5 3 1 6 0 8-3 2 3 5 4 8 3-1-3-4-5-8-5z"/></svg></span>
          <span class="brand-name">MindBloom</span>
        </div>
        <div class="topbar-stats" id="topbar-stats"></div>
        <a href="#/sos" class="icon-btn sos-btn" title="Emergency help" aria-label="Emergency help"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9.5 16h-19z"/><line x1="12" y1="10" x2="12" y2="14.5"/><circle cx="12" cy="17.3" r="0.6" fill="currentColor"/></svg></a>
        <button id="btn-signout" class="icon-btn" title="Sign out" aria-label="Sign out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5a1 1 0 00-1 1v14a1 1 0 001 1h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </header>

      <div class="body-row">
        <nav class="sidenav" id="sidenav"></nav>
        <div class="nav-backdrop" id="nav-backdrop"></div>

        <main id="view" class="view"></main>
      </div>

      <nav class="bottomnav" id="bottomnav"></nav>
    </div>

    <!-- Toast / celebration layer -->
    <div id="fx-layer" class="fx-layer"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
